name: CI

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  UV_CACHE_DIR: ./.uv-cache
  UV_VERSION: 0.12.3

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      ocr: ${{ steps.scopes.outputs.ocr }}
      macos_dependencies: ${{ steps.scopes.outputs.macos_dependencies }}
      portability: ${{ steps.scopes.outputs.portability }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Detect heavyweight CI scopes
        id: scopes
        env:
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/ci-scope.mjs >> "$GITHUB_OUTPUT"

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - name: Install Node deps
        run: pnpm install --frozen-lockfile
      - name: Setup uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: '3.12'
          enable-cache: true
          cache-local-path: .uv-cache
          cache-suffix: quality
      - name: Restore Turbo cache
        uses: actions/cache@v5
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'uv.lock') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'uv.lock') }}-
            turbo-${{ runner.os }}-
      - name: Sync Python workspace
        run: uv --cache-dir ./.uv-cache sync --project . --all-packages --all-groups --locked
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck

  frontend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - name: Install Node deps
        run: pnpm install --frozen-lockfile
      - name: Repository script tests
        run: pnpm test:scripts
      - name: Frontend tests
        run: pnpm --filter @card-reader/web test

  python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: core
            package: card-reader-core
            filter: '@card-reader/core'
          - target: api
            package: card-reader-api
            filter: '@card-reader/api'
          - target: parser
            package: card-reader-parser
            filter: '@card-reader/parser'
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - name: Setup uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: '3.12'
          enable-cache: true
          cache-local-path: .uv-cache
          cache-suffix: python-${{ matrix.target }}
      - name: Sync package dependencies
        run: uv --cache-dir ./.uv-cache sync --project . --package ${{ matrix.package }} --all-groups --locked
      - name: Run ${{ matrix.target }} tests
        run: pnpm --filter ${{ matrix.filter }} test

  ocr-integration:
    needs: changes
    if: needs.changes.outputs.ocr == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: full-flow
            tests: tests/test_parser_db_full_flow_cases.py
          - group: workflows-and-stats
            tests: tests/test_card_edit_reparse.py tests/test_metadata_suggestions.py tests/test_catalog_contract.py tests/test_stats_region_ocr.py tests/test_name_mana_cost_region_ocr.py
    env:
      PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK: 'True'
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - name: Setup uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: '3.12'
          enable-cache: true
          cache-local-path: .uv-cache
          cache-suffix: ocr-integration-${{ matrix.group }}
      - name: Sync integration dependencies
        run: uv --cache-dir ./.uv-cache sync --project . --package card-reader-integration --all-groups --locked
      - name: Run ${{ matrix.group }} real OCR integration tests
        working-directory: services/integration
        run: uv --cache-dir ../../.uv-cache run --project ../.. --package card-reader-integration pytest --tb=long -vv --durations=20 --durations-min=0.5 ${{ matrix.tests }}

  macos-dependencies:
    needs: changes
    if: needs.changes.outputs.macos_dependencies == 'true'
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Setup uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: '3.12'
          enable-cache: true
          cache-local-path: .uv-cache
          cache-suffix: macos-dependencies
      - name: Sync Python workspace on macOS ARM64
        run: node scripts/check-native-platform.mjs && uv --cache-dir ./.uv-cache sync --project . --all-packages --all-groups --locked
      - name: Import PaddlePaddle
        run: uv run --project . --package card-reader-parser python -c "import paddle; print(paddle.__version__)"

  portability:
    needs: changes
    if: needs.changes.outputs.portability == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Check Unix script metadata and syntax
        run: |
          test -x scripts/create-backup.sh
          test -x scripts/restore-backup.sh
          bash -n scripts/create-backup.sh scripts/restore-backup.sh
      - name: Validate Compose configurations
        run: |
          cp .env.example .env
          docker compose config --quiet
          docker compose -f docker-compose.yml -f docker-compose.local.yml config --quiet
      - uses: docker/setup-buildx-action@v3
      - name: Build linux/amd64 parser image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/parser.Dockerfile
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=parser-amd64
          cache-to: type=gha,mode=max,scope=parser-amd64

  checks:
    if: always()
    needs:
      - changes
      - quality
      - frontend-tests
      - python-tests
      - ocr-integration
      - macos-dependencies
      - portability
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify required jobs
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          FRONTEND_RESULT: ${{ needs.frontend-tests.result }}
          PYTHON_RESULT: ${{ needs.python-tests.result }}
          OCR_RESULT: ${{ needs.ocr-integration.result }}
          MACOS_RESULT: ${{ needs.macos-dependencies.result }}
          PORTABILITY_RESULT: ${{ needs.portability.result }}
        run: |
          for result in "$CHANGES_RESULT" "$QUALITY_RESULT" "$FRONTEND_RESULT" "$PYTHON_RESULT" "$OCR_RESULT" "$MACOS_RESULT" "$PORTABILITY_RESULT"; do
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              echo "A required CI job ended with result: $result"
              exit 1
            fi
          done
