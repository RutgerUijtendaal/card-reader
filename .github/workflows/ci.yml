name: CI

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  UV_CACHE_DIR: ./.uv-cache
  UV_VERSION: 0.12.3

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      ocr: ${{ steps.scopes.outputs.ocr }}
      macos_dependencies: ${{ steps.scopes.outputs.macos_dependencies }}
      portability: ${{ steps.scopes.outputs.portability }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Detect heavyweight CI scopes
        id: scopes
        env:
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/ci-scope.mjs >> "$GITHUB_OUTPUT"

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - name: Install Node deps
        run: pnpm install --frozen-lockfile
      - name: Setup uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: '3.12'
          enable-cache: true
          cache-local-path: .uv-cache
          cache-suffix: quality
      - name: Restore Turbo cache
        uses: actions/cache@v5
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'uv.lock') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'uv.lock') }}-
            turbo-${{ runner.os }}-
      - name: Sync Python workspace
        run: uv --cache-dir ./.uv-cache sync --project . --all-packages --all-groups --locked
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck

  frontend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - name: Install Node deps
        run: pnpm install --frozen-lockfile
      - name: Repository script tests
        run: pnpm test:scripts
      - name: Frontend tests
        run: pnpm --filter @card-reader/web test

  python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: core
            package: card-reader-core
            filter: '@card-reader/core'
          - target: api
            package: card-reader-api
            filter: '@card-reader/api'
          - target: parser
            package: card-reader-parser
            filter: '@card-reader/parser'
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - name: Setup uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: '3.12'
          enable-cache: true
          cache-local-path: .uv-cache
          cache-suffix: python-${{ matrix.target }}
      - name: Sync package dependencies
        run: uv --cache-dir ./.uv-cache sync --project . --package ${{ matrix.package }} --all-groups --locked
      - name: Run ${{ matrix.target }} tests
        run: pnpm --filter ${{ matrix.filter }} test

  ocr-integration:
    needs: changes
    if: needs.changes.outputs.ocr == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: full-flow
            tests: tests/test_parser_db_full_flow_cases.py
          - group: workflows-and-stats
            tests: tests/test_card_edit_reparse.py tests/test_metadata_suggestions.py tests/test_catalog_contract.py tests/test_stats_region_ocr.py tests/test_name_mana_cost_region_ocr.py
    env:
      PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK: 'True'
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - name: Setup uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: '3.12'
          enable-cache: true
          cache-local-path: .uv-cache
          cache-suffix: ocr-integration-${{ matrix.group }}
      - name: Sync integration dependencies
        run: uv --cache-dir ./.uv-cache sync --project . --package card-reader-integration --all-groups --locked
      - name: Run ${{ matrix.group }} real OCR integration tests
        working-directory: services/integration
        run: uv --cache-dir ../../.uv-cache run --project ../.. --package card-reader-integration pytest --tb=long -vv --durations=20 --durations-min=0.5 ${{ matrix.tests }}

  macos-dependencies:
    needs: changes
    if: needs.changes.outputs.macos_dependencies == 'true'
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Setup uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: '3.12'
          enable-cache: true
          cache-local-path: .uv-cache
          cache-suffix: macos-dependencies
      - name: Sync Python workspace on macOS ARM64
        run: node scripts/check-native-platform.mjs && uv --cache-dir ./.uv-cache sync --project . --all-packages --all-groups --locked
      - name: Import PaddlePaddle
        run: uv run --project . --package card-reader-parser python -c "import paddle; print(paddle.__version__)"

  portability:
    needs: changes
    if: needs.changes.outputs.portability == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Check Unix script metadata and syntax
        run: |
          test -x scripts/create-backup.sh
          test -x scripts/restore-backup.sh
          bash -n scripts/create-backup.sh scripts/restore-backup.sh
      - name: Validate Compose configurations
        run: |
          cp .env.example .env
          docker compose config --quiet
          docker compose -f docker-compose.yml -f docker-compose.local.yml config --quiet
      - uses: docker/setup-buildx-action@v3
      - name: Build linux/amd64 API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/api.Dockerfile
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=api-amd64
          cache-to: type=gha,mode=max,scope=api-amd64
      - name: Build linux/amd64 parser image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/parser.Dockerfile
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=parser-amd64
          cache-to: type=gha,mode=max,scope=parser-amd64

  checks:
    if: always()
    needs:
      - changes
      - quality
      - frontend-tests
      - python-tests
      - ocr-integration
      - macos-dependencies
      - portability
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify required jobs
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          FRONTEND_RESULT: ${{ needs.frontend-tests.result }}
          PYTHON_RESULT: ${{ needs.python-tests.result }}
          OCR_RESULT: ${{ needs.ocr-integration.result }}
          MACOS_RESULT: ${{ needs.macos-dependencies.result }}
          PORTABILITY_RESULT: ${{ needs.portability.result }}
        run: |
          for result in "$CHANGES_RESULT" "$QUALITY_RESULT" "$FRONTEND_RESULT" "$PYTHON_RESULT" "$OCR_RESULT" "$MACOS_RESULT" "$PORTABILITY_RESULT"; do
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              echo "A required CI job ended with result: $result"
              exit 1
            fi
          done

  publish_api:
    needs: checks
    if: >-
      github.repository == 'RutgerUijtendaal/card-reader' &&
      github.ref == 'refs/heads/master' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish API image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/api.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/rutgeruijtendaal/card-reader-api:${{ github.sha }}
          cache-from: type=gha,scope=production-api-amd64
          cache-to: type=gha,mode=max,scope=production-api-amd64

  publish_parser:
    needs: checks
    if: >-
      github.repository == 'RutgerUijtendaal/card-reader' &&
      github.ref == 'refs/heads/master' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish parser image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/parser.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/rutgeruijtendaal/card-reader-parser:${{ github.sha }}
          cache-from: type=gha,scope=production-parser-amd64
          cache-to: type=gha,mode=max,scope=production-parser-amd64

  release:
    needs:
      - publish_api
      - publish_parser
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - name: Install Node deps
        run: pnpm install --frozen-lockfile
      - name: Build production frontend
        env:
          VITE_API_BASE_URL: /api
        run: pnpm --filter @card-reader/web build
      - name: Assemble immutable release archive
        env:
          API_IMAGE_DIGEST: ${{ needs.publish_api.outputs.digest }}
          PARSER_IMAGE_DIGEST: ${{ needs.publish_parser.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$API_IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$PARSER_IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]

          release_dir="$(mktemp -d)"
          archive="card-reader-${GITHUB_SHA}.tar.gz"
          mkdir -p "$release_dir/frontend" "$release_dir/scripts"
          cp -a frontend/dist/. "$release_dir/frontend/"
          cp docker-compose.yml "$release_dir/docker-compose.yml"
          install -m 0755 scripts/create-backup.sh "$release_dir/scripts/create-backup.sh"
          install -m 0755 scripts/restore-backup.sh "$release_dir/scripts/restore-backup.sh"
          printf '%s\n' \
            "CARD_READER_RELEASE_REVISION=$GITHUB_SHA" \
            "CARD_READER_API_IMAGE=ghcr.io/rutgeruijtendaal/card-reader-api@$API_IMAGE_DIGEST" \
            "CARD_READER_PARSER_IMAGE=ghcr.io/rutgeruijtendaal/card-reader-parser@$PARSER_IMAGE_DIGEST" \
            > "$release_dir/release.env"
          tar -C "$release_dir" -czf "$archive" frontend docker-compose.yml scripts release.env

          actual_top_level="$(tar -tzf "$archive" | sed -E 's#^\./##; /^$/d; s#/.*$##' | sort -u)"
          expected_top_level="$(printf '%s\n' docker-compose.yml frontend release.env scripts | sort)"
          if [[ "$actual_top_level" != "$expected_top_level" ]]; then
            echo "Unexpected release archive contents:" >&2
            printf '%s\n' "$actual_top_level" >&2
            exit 1
          fi
          sha256sum "$archive"
      - name: Upload release artifact
        uses: actions/upload-artifact@v6
        with:
          name: card-reader-release-${{ github.sha }}
          path: card-reader-${{ github.sha }}.tar.gz
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  production_deploy_gate:
    needs: release
    if: >-
      github.repository == 'RutgerUijtendaal/card-reader' &&
      github.ref == 'refs/heads/master' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      enabled: ${{ steps.gate.outputs.enabled }}
      current: ${{ steps.current_revision.outputs.current }}
    steps:
      - name: Resolve production deployment gate
        id: gate
        env:
          AUTO_DEPLOY_ENABLED: ${{ vars.AUTO_DEPLOY_ENABLED }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" || "$AUTO_DEPLOY_ENABLED" == "true" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Automatic production deployment is disabled."
          fi
      - name: Confirm revision is still current master
        if: steps.gate.outputs.enabled == 'true'
        id: current_revision
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          current_revision="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/master" --jq .object.sha)"
          if [[ "$current_revision" == "$GITHUB_SHA" ]]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "Skipping superseded revision $GITHUB_SHA; current master is $current_revision."
          fi

  deploy_production:
    needs:
      - release
      - production_deploy_gate
    if: >-
      needs.production_deploy_gate.outputs.enabled == 'true' &&
      needs.production_deploy_gate.outputs.current == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://maityscardgame.com
    concurrency:
      group: production-card-reader
      cancel-in-progress: false
    steps:
      - name: Download release artifact
        uses: actions/download-artifact@v7
        with:
          name: card-reader-release-${{ github.sha }}
      - name: Configure deployment SSH identity
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          test -n "$DEPLOY_SSH_PRIVATE_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
          install -m 0700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > "$HOME/.ssh/card-reader-deploy"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/card-reader-deploy" "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/card-reader-deploy" >/dev/null
          ssh-keygen -F "$DEPLOY_HOST" -f "$HOME/.ssh/known_hosts" >/dev/null
      - name: Upload and deploy release
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]

          archive="card-reader-${GITHUB_SHA}.tar.gz"
          remote_archive="/var/www/maityscardgame.com/incoming/$archive"
          checksum="$(sha256sum "$archive" | awk '{print $1}')"
          [[ "$checksum" =~ ^[0-9a-f]{64}$ ]]

          scp \
            -i "$HOME/.ssh/card-reader-deploy" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$archive" \
            "${DEPLOY_USER}@${DEPLOY_HOST}:${remote_archive}"
          ssh \
            -i "$HOME/.ssh/card-reader-deploy" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "sudo /usr/local/sbin/deploy-card-reader '$GITHUB_SHA' '$remote_archive' '$checksum'"
