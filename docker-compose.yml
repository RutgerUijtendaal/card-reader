services:
  api:
    image: ${CARD_READER_API_IMAGE:-card-reader-api:local}
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    container_name: card-reader-api
    restart: unless-stopped
    env_file:
      - ${CARD_READER_ENV_FILE:-.env}
    environment:
      CARD_READER_ENV: ${CARD_READER_ENV:-production}
      CARD_READER_API_HOST: 0.0.0.0
      CARD_READER_API_PORT: 8000
      CARD_READER_APP_DATA_DIR: /var/lib/card-reader
      CARD_READER_DATABASE_PATH: ${CARD_READER_DATABASE_PATH:-card_reader.db}
      CARD_READER_DEVELOPER_DATA_DIR: ${CARD_READER_DEVELOPER_DATA_DIR:-/var/lib/card-reader/dev-data}
      CARD_READER_DEVELOPER_DATA_ACCEL_REDIRECT_PREFIX: "${CARD_READER_DEVELOPER_DATA_ACCEL_REDIRECT_PREFIX:-}"
      CARD_READER_DEVELOPER_DATA_PUBLIC_API_BASE_URL: ${CARD_READER_DEVELOPER_DATA_PUBLIC_API_BASE_URL:-https://maityscardgame.com/api}
      CARD_READER_RELEASE_REVISION: ${CARD_READER_RELEASE_REVISION:-unknown}
      CARD_READER_SAVE_DEBUG_CROPS: ${CARD_READER_SAVE_DEBUG_CROPS:-false}
      CARD_READER_CORS_ORIGINS: '${CARD_READER_CORS_ORIGINS:-["http://localhost:5173"]}'
    ports:
      - "${CARD_READER_API_BIND:-127.0.0.1}:8000:8000"
    volumes:
      - "${CARD_READER_APP_DATA_DIR:-/var/lib/card-reader}:/var/lib/card-reader"
      - "${CARD_READER_PUBLIC_APP_DATA_DIR:-/var/lib/card-reader/public}/images:/var/lib/card-reader/images"
      - "${CARD_READER_PUBLIC_APP_DATA_DIR:-/var/lib/card-reader/public}/symbols:/var/lib/card-reader/symbols"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)\"",
        ]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s

  developer-data-builder:
    image: ${CARD_READER_API_IMAGE:-card-reader-api:local}
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    container_name: card-reader-developer-data-builder
    restart: unless-stopped
    command:
      [
        "uv",
        "run",
        "--frozen",
        "--package",
        "card-reader-api",
        "python",
        "manage.py",
        "run_dev_data_builder",
      ]
    env_file:
      - ${CARD_READER_ENV_FILE:-.env}
    environment:
      CARD_READER_ENV: ${CARD_READER_ENV:-production}
      CARD_READER_APP_DATA_DIR: /var/lib/card-reader
      CARD_READER_DATABASE_PATH: ${CARD_READER_DATABASE_PATH:-card_reader.db}
      CARD_READER_DEVELOPER_DATA_DIR: ${CARD_READER_DEVELOPER_DATA_DIR:-/var/lib/card-reader/dev-data}
      CARD_READER_DEVELOPER_DATA_PUBLIC_API_BASE_URL: ${CARD_READER_DEVELOPER_DATA_PUBLIC_API_BASE_URL:-https://maityscardgame.com/api}
      CARD_READER_RELEASE_REVISION: ${CARD_READER_RELEASE_REVISION:-unknown}
    volumes:
      - "${CARD_READER_APP_DATA_DIR:-/var/lib/card-reader}:/var/lib/card-reader"
      - "${CARD_READER_PUBLIC_APP_DATA_DIR:-/var/lib/card-reader/public}/images:/var/lib/card-reader/images"
      - "${CARD_READER_PUBLIC_APP_DATA_DIR:-/var/lib/card-reader/public}/symbols:/var/lib/card-reader/symbols"
    depends_on:
      api:
        condition: service_healthy

  tts-sheet-renderer:
    image: ${CARD_READER_API_IMAGE:-card-reader-api:local}
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    container_name: card-reader-tts-sheet-renderer
    restart: unless-stopped
    command:
      [
        "uv",
        "run",
        "--frozen",
        "--package",
        "card-reader-api",
        "python",
        "manage.py",
        "run_tts_sheet_renderer",
      ]
    env_file:
      - ${CARD_READER_ENV_FILE:-.env}
    environment:
      CARD_READER_ENV: ${CARD_READER_ENV:-production}
      CARD_READER_APP_DATA_DIR: /var/lib/card-reader
      CARD_READER_DATABASE_PATH: ${CARD_READER_DATABASE_PATH:-card_reader.db}
      CARD_READER_RELEASE_REVISION: ${CARD_READER_RELEASE_REVISION:-unknown}
    volumes:
      - "${CARD_READER_APP_DATA_DIR:-/var/lib/card-reader}:/var/lib/card-reader"
      - "${CARD_READER_PUBLIC_APP_DATA_DIR:-/var/lib/card-reader/public}/images:/var/lib/card-reader/images"
      - "${CARD_READER_PUBLIC_APP_DATA_DIR:-/var/lib/card-reader/public}/symbols:/var/lib/card-reader/symbols"
    depends_on:
      api:
        condition: service_healthy

  parser:
    image: ${CARD_READER_PARSER_IMAGE:-card-reader-parser:local}
    platform: ${CARD_READER_PARSER_PLATFORM:-linux/amd64}
    build:
      context: .
      dockerfile: docker/parser.Dockerfile
    container_name: card-reader-parser
    restart: unless-stopped
    env_file:
      - ${CARD_READER_ENV_FILE:-.env}
    environment:
      CARD_READER_ENV: ${CARD_READER_ENV:-production}
      CARD_READER_APP_DATA_DIR: /var/lib/card-reader
      CARD_READER_DATABASE_PATH: ${CARD_READER_DATABASE_PATH:-card_reader.db}
      CARD_READER_RELEASE_REVISION: ${CARD_READER_RELEASE_REVISION:-unknown}
      CARD_READER_SAVE_DEBUG_CROPS: ${CARD_READER_SAVE_DEBUG_CROPS:-false}
      DJANGO_SETTINGS_MODULE: card_reader_core.django_settings
      PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK: ${PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK:-True}
      OMP_NUM_THREADS: ${OMP_NUM_THREADS:-1}
      MKL_NUM_THREADS: ${MKL_NUM_THREADS:-1}
      OPENBLAS_NUM_THREADS: ${OPENBLAS_NUM_THREADS:-1}
      FLAGS_use_mkldnn: ${FLAGS_use_mkldnn:-0}
    volumes:
      - "${CARD_READER_APP_DATA_DIR:-/var/lib/card-reader}:/var/lib/card-reader"
      - "${CARD_READER_PUBLIC_APP_DATA_DIR:-/var/lib/card-reader/public}/images:/var/lib/card-reader/images"
      - "${CARD_READER_PUBLIC_APP_DATA_DIR:-/var/lib/card-reader/public}/symbols:/var/lib/card-reader/symbols"
    depends_on:
      api:
        condition: service_healthy
